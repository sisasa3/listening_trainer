<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDEEE9">
<title>청크 리스닝</title>
<style>
:root{
  --bg:#EDEEE9; --panel:#FFFFFF; --ink:#1B1C1A; --muted:#6B6E66;
  --line:#D8DAD2; --accent:#2B4BD8; --accent-soft:#E3E8FB;
  --warn:#E8541E; --warn-soft:#FBE9E1; --ok:#1F7A3D;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  font-size:15px; line-height:1.45;
}
.num{font-family:'Roboto Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font:inherit; border:none; cursor:pointer; background:none; color:inherit}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ---------- 홈 화면 ---------- */
#home{flex:1; overflow-y:auto; padding:28px 20px 40px; display:flex; flex-direction:column; gap:22px}
#home h1{font-size:26px; font-weight:800; letter-spacing:-0.02em}
#home .sub{color:var(--muted); margin-top:4px; font-size:14px}
.urlbox{display:flex; flex-direction:column; gap:10px}
.urlbox input{
  width:100%; padding:15px 16px; border:1.5px solid var(--line); border-radius:var(--r);
  font:inherit; background:var(--panel); color:var(--ink);
}
.urlbox input:focus{outline:none; border-color:var(--accent)}
.btn-load{
  padding:15px; border-radius:var(--r); background:var(--accent); color:#fff;
  font-weight:700; font-size:16px;
}
.btn-load:disabled{background:var(--line); color:var(--muted)}
.recent h2, .sheet h2{font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px}
.recent-item{
  width:100%; text-align:left; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r); padding:10px 10px 10px 10px; margin-bottom:8px;
  display:flex; align-items:center; gap:11px;
}
.recent-item .thumb{width:64px; height:36px; border-radius:7px; object-fit:cover; background:var(--line); flex-shrink:0}
.recent-item .meta{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.recent-item .t{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.recent-item .p{color:var(--muted); font-size:12px; display:flex; gap:7px; align-items:center}
.recent-item .p b{color:var(--accent); font-weight:800}
.recent-item .go{flex:1; display:flex; align-items:center; gap:11px; min-width:0; text-align:left}
.recent-item .rm{
  flex-shrink:0; padding:9px 11px; color:var(--muted); font-size:17px; font-weight:700;
  border-radius:9px; line-height:1;
}
.recent-item .rm:active{background:var(--warn-soft); color:var(--warn)}
.recent-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.recent-head h2{margin:0}
.recent-head .clearall{font-size:12px; font-weight:700; color:var(--muted); padding:4px 6px}
.err{color:var(--warn); font-size:13px; display:none}

/* ---------- 학습 화면 ---------- */
#trainer{flex:1; display:none; flex-direction:column; height:100dvh; max-height:100dvh; overflow:hidden}
.topbar{display:flex; align-items:center; gap:6px; padding:6px 12px 5px; flex-shrink:0}
.topbar .back{padding:6px 8px; font-size:13px; color:var(--muted); font-weight:600}
.topbar .title{flex:1; font-size:12px; font-weight:600; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#playerWrap{width:100%; aspect-ratio:16/9; background:#000; max-height:26dvh; flex-shrink:0; position:relative; overflow:hidden}
#playerWrap iframe{
  position:absolute; left:0; width:100%; height:134%; top:-17%;
}
.shield{display:none}

.stage{
  flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column;
  padding:10px 14px 6px; gap:9px; justify-content:flex-start;
}

/* 청크 헤더 */
.chunkbar{display:flex; align-items:center; gap:6px}
.chunkbar .range{font-size:19px; font-weight:800; letter-spacing:-0.01em; flex:1; text-align:center; white-space:nowrap}
.chunkbar .range small{font-size:11px; color:var(--muted); font-weight:600; margin-left:4px}
.chunkbar .nav{
  background:var(--panel); border:1.5px solid var(--line); border-radius:9px;
  width:34px; height:34px; font-size:18px; font-weight:700; color:var(--muted); flex-shrink:0;
}
.chunkbar .icn{
  background:var(--panel); border:1.5px solid var(--line); border-radius:9px;
  width:38px; height:34px; font-size:13px; font-weight:800; color:var(--muted); flex-shrink:0;
}
.chunkbar .icn.on{background:var(--accent); border-color:var(--accent); color:#fff}
#playerWrap.nocrop iframe{height:100%; top:0}

/* 조절 */
.chunkadj{display:flex; gap:5px; align-items:center; justify-content:space-between}
.chunkadj button{
  background:var(--panel); border:1.5px solid var(--line); border-radius:9px;
  padding:9px 0; font-weight:700; font-size:14px; flex:1; min-width:0;
}
.chunkadj button:active{background:var(--accent-soft); border-color:var(--accent)}
.chunkadj .lbl{font-size:11px; color:var(--muted); font-weight:600; flex-shrink:0; padding-right:1px}
.chunkadj .lbl+button{margin-left:0}
.chunkadj .lenval{font-weight:800; font-size:14px; width:32px; text-align:center; flex-shrink:0}

/* 속도 게이지 (시그니처) */
.gauge{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 11px 12px;
}
.gauge .glabel{
  display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  font-size:12px; color:var(--muted); font-weight:600; margin-bottom:8px;
}
.gauge .glabel .msg{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gauge .glabel .msg.await{color:var(--accent); font-weight:700}
.steps{display:flex; gap:5px}
.step{
  flex:1; text-align:center; padding:8px 0 7px; border-radius:8px;
  border:1.5px solid var(--line); font-weight:700; font-size:13px; color:var(--muted);
  transition:all .18s ease;
}
.step .s-sub{display:block; font-size:9px; font-weight:600; margin-top:1px}
.step.done{border-color:transparent; background:var(--bg); color:#A8ABA1}
.step.now{border-color:var(--accent); background:var(--accent); color:#fff; box-shadow:0 3px 8px rgba(43,75,216,.25)}
.step.now .s-sub{color:#DCE3FA}

.vidcover{
  position:absolute; inset:0; background:var(--ink); color:#8E918A;
  display:none; align-items:center; justify-content:center; font-size:13px; font-weight:700;
}
#playerWrap.hidevid .vidcover{display:flex}

/* 복습 */
.review{display:flex; gap:6px; align-items:center}
.review .lbl{font-size:11px; color:var(--muted); font-weight:700; flex-shrink:0}
.review button{
  flex:1; padding:9px 0; border-radius:10px; border:1.5px solid var(--line);
  background:var(--panel); font-size:13px; font-weight:700; color:var(--ink);
}
.review button:active{background:var(--accent-soft); border-color:var(--accent)}
.review.revon{display:none; background:var(--accent-soft); border-radius:11px; padding:8px 10px; gap:10px}
.review.revon.on{display:flex}
.review.revon .rv-txt{flex:1; font-size:13px; font-weight:800; color:var(--accent)}
.review.revon button{flex:0 0 auto; padding:7px 12px; background:var(--accent); color:#fff; border-color:var(--accent)}
.review.hide{display:none}

.chiprow{display:flex; gap:8px; justify-content:center; margin-top:auto; margin-bottom:2px}
.sheetchip{
  padding:7px 13px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); font-size:12px; font-weight:700; color:var(--muted);
}
.sheetchip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.sheetchip .cnt{color:var(--warn); font-weight:800; margin-left:3px}

/* 판정 버튼 */
.judge{
  flex-shrink:0;
  padding:6px 14px calc(16px + env(safe-area-inset-bottom, 0px));
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto; gap:8px;
  background:var(--bg);
}
.judge .b{
  border-radius:14px; padding:12px 6px; font-size:15px; font-weight:800;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  border:1.5px solid var(--line); background:var(--panel);
  transition:transform .08s ease;
}
.judge .b:active{transform:scale(.97)}
.judge .b small{font-size:10px; font-weight:600; opacity:.75}
.judge .b-heard{grid-column:1 / -1; background:var(--ink); color:#fff; border-color:var(--ink)}
.judge .b-again{color:var(--ink); background:var(--panel)}
.judge .b-flag{color:var(--warn); border-color:var(--warn); background:var(--warn-soft)}

/* 짧은 화면 대응 */
@media (max-height:700px){
  #playerWrap{max-height:23dvh}
  .stage{gap:7px; padding:8px 12px 4px}
  .chunkbar .range{font-size:17px}
  .judge .b{padding:10px 6px; font-size:14px}
  .step .s-sub{display:none}
  .step{padding:9px 0}
}
@media (max-height:600px){
  .sheetchip{display:none}
  .topbar{padding:4px 12px 3px}
  .judge .b small{display:none}
}

/* 미해결 시트 */
.sheet{
  position:fixed; left:0; right:0; bottom:0; max-height:70dvh; overflow-y:auto;
  background:var(--panel); border-radius:20px 20px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.18); transform:translateY(105%); transition:transform .25s ease;
  z-index:50;
}
.sheet.open{transform:translateY(0)}
.sheet .close{position:absolute; right:14px; top:12px; padding:6px 10px; color:var(--muted); font-weight:700}
.flag-item{
  border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:9px;
  display:flex; flex-direction:column; gap:6px;
}
.flag-item .fi-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.flag-item .fi-title{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.flag-item .fi-range{font-weight:800; font-size:15px; flex-shrink:0}
.flag-item .fi-actions{display:flex; gap:8px}
.flag-item .fi-actions a, .flag-item .fi-actions button{
  font-size:12px; font-weight:700; padding:7px 11px; border-radius:8px;
  border:1.5px solid var(--line); text-decoration:none; color:var(--ink); background:var(--bg);
}
.flag-item .fi-actions .del{color:var(--warn); border-color:transparent; background:none}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:24px 0}
.overlay{position:fixed; inset:0; background:rgba(27,28,26,.3); z-index:40; display:none}
.overlay.on{display:block}
</style>
</head>
<body>

<!-- ═══════ 홈 ═══════ -->
<section id="home">
  <div>
    <h1>청크 리스닝</h1>
    <div class="sub">한 구간이 들릴 때까지, 다음으로 넘어가지 않습니다</div>
  </div>
  <div id="protoWarn" style="display:none; background:var(--warn-soft); border:1.5px solid var(--warn); border-radius:var(--r); padding:13px 15px; font-size:13px; line-height:1.6">
    <b style="color:var(--warn)">이 파일은 file:// 로 열려 있습니다.</b><br>
    YouTube 제어 API가 file:// 에서는 동작하지 않아 영상을 불러올 수 없습니다.
    GitHub Pages 등 https 주소에 올린 뒤 접속해 주세요.
  </div>
  <div class="urlbox">
    <input id="urlInput" type="url" inputmode="url" placeholder="YouTube 링크 붙여넣기" autocomplete="off">
    <div class="err" id="urlErr">링크에서 영상 ID를 찾지 못했습니다. 주소를 확인해 주세요.</div>
    <button class="btn-load" id="btnLoad">불러오기</button>
  </div>
  <div class="recent" id="recentWrap" style="display:none">
    <div class="recent-head">
      <h2>이어서 학습</h2>
      <button class="clearall" id="btnClearRecent">전체 삭제</button>
    </div>
    <div id="recentList"></div>
  </div>
  <div class="recent" id="homeFlagsWrap" style="display:none">
    <h2>미해결 구간 <span class="num" id="homeFlagCnt"></span></h2>
    <button class="recent-item" id="btnHomeFlags" style="padding:13px 15px"><span class="t" style="flex:1">목록 보기 · PC에서 자막으로 확인</span><span class="p">›</span></button>
  </div>
</section>

<!-- ═══════ 학습 ═══════ -->
<section id="trainer">
  <div class="topbar">
    <button class="back" id="btnBack">‹ 홈</button>
    <div class="title" id="vTitle"></div>
  </div>
  <div id="playerWrap">
    <div id="ytp"></div>
    <div class="shield" id="shield"></div>
    <div class="vidcover" id="vidCover">🎧 영상 숨김 · 오디오 재생 중</div>
  </div>

  <div class="stage">
    <div class="chunkbar">
      <button class="nav" id="prevChunk" aria-label="이전 청크">‹</button>
      <div class="range num" id="chunkRange">0:00 – 0:06 <small>#1</small></div>
      <button class="nav" id="nextChunk" aria-label="다음 청크">›</button>
      <button class="icn" id="btnCC" aria-label="자막 켜기/끄기">CC</button>
    </div>

    <div class="chunkadj">
      <span class="lbl">시작</span>
      <button id="adjBack">−1</button>
      <button id="adjFwd">+1</button>
      <span class="lbl">길이</span>
      <button id="lenDown">−1</button>
      <span class="lenval num" id="lenVal">6s</span>
      <button id="lenUp">+1</button>
    </div>

    <div class="gauge">
      <div class="glabel">
        <span class="msg" id="statusMsg">재생을 시작하세요</span>
        <span class="num" id="playCount">0 / 5</span>
      </div>
      <div class="steps" id="stepsRow"></div>
    </div>

    <div class="review" id="reviewBar">
      <span class="lbl">복습</span>
      <button data-m="0.5">30초</button>
      <button data-m="1">1분</button>
      <button data-m="3">3분</button>
      <button data-m="5">5분</button>
    </div>
    <div class="review revon" id="reviewOn">
      <span class="rv-txt num" id="rvTxt"></span>
      <button id="btnRvEnd">복습 종료</button>
    </div>

    <div class="chiprow">
      <button class="sheetchip" id="btnSheet">미해결 목록 <span class="cnt num" id="flagCnt">0</span></button>
      <button class="sheetchip" id="btnHideVid">영상 숨기기</button>
    </div>
  </div>

  <div class="judge">
    <button class="b b-heard" id="btnHeard">들렸음<small>다음 청크로</small></button>
    <button class="b b-again" id="btnAgain">한 번 더<small>처음 단계부터</small></button>
    <button class="b b-flag" id="btnFlag">미해결<small>표시하고 넘어가기</small></button>
  </div>
</section>

<!-- ═══════ 미해결 시트 ═══════ -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <button class="close" id="btnSheetClose">닫기</button>
  <h2>미해결 구간</h2>
  <div id="flagList"></div>
</div>

<script>
'use strict';
/* ───────── 상수/상태 ───────── */
const SPEEDS = [1, 0.75, 0.5, 1, 1];           // YouTube API 지원 배속만 사용 가능
const LS_KEY = 'clt_state_v1';
const POLL_MS = 150, MAX_ROUNDS = 8;

let player = null, ytReady = false, pendingId = null;
let RATES = null;                                  // 플레이어가 실제 지원하는 배속
function effRate(r){
  if(!RATES || !RATES.length) return r;
  let best = RATES[0];
  for(const x of RATES) if(Math.abs(x - r) < Math.abs(best - r)) best = x;
  return best;
}
function setRate(r){
  const e = effRate(r);
  try{ player.setPlaybackRate(e); }catch(err){}
  return e;
}
let S = load();                                 // { videos:{id:{title,pos,len}}, flags:[] }
let cur = null;                                 // { id, title, start, len, step, mode }
let pollTimer = null, gapTimer = null, wakeLock = null;

function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && d.videos) return d; }catch(e){}
  return { videos:{}, flags:[] };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ───────── 유틸 ───────── */
const $ = id => document.getElementById(id);
function fmt(t){ t=Math.max(0,Math.floor(t)); const m=Math.floor(t/60), s=t%60; return m+':'+String(s).padStart(2,'0'); }
function extractId(url){
  const p = [/[?&]v=([\w-]{11})/, /youtu\.be\/([\w-]{11})/, /shorts\/([\w-]{11})/, /embed\/([\w-]{11})/, /live\/([\w-]{11})/];
  for(const r of p){ const m = url.match(r); if(m) return m[1]; }
  return null;
}
async function grabWake(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function dropWake(){ if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; } }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && cur && cur.mode==='running') grabWake(); });

/* ───────── YouTube API ───────── */
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => { ytReady = true; if(pendingId){ mountPlayer(pendingId); pendingId = null; } };

let readyTimer = null;
function mountPlayer(vid){
  if(player){ player.destroy(); player = null; }
  clearTimeout(readyTimer);
  readyTimer = setTimeout(()=>{
    setStatus(location.protocol === 'file:'
      ? '실패: file://에서는 제어 불가'
      : '불러오기 실패 · 네트워크 확인');
  }, 12000);
  player = new YT.Player('ytp', {
    videoId: vid,
    playerVars: { playsinline:1, rel:0, controls:0, modestbranding:1, disablekb:1, fs:0, iv_load_policy:3 },
    events: {
      onReady: () => {
        clearTimeout(readyTimer);
        const data = player.getVideoData();
        cur.title = (data && data.title) || cur.title || '';
        $('vTitle').textContent = cur.title;
        S.videos[cur.id] = { title:cur.title, pos:cur.start, len:cur.len, at:Date.now() }; save();
        setStatus('');
        try{
          const r = player.getAvailablePlaybackRates();
          if(r && r.length) RATES = r.slice().sort((a,b)=>a-b);
        }catch(e){}
        renderSteps();
        applyCC();
        restartCycle();
        // 자동재생이 차단된 경우 안내
        setTimeout(()=>{
          if(!cur) return;
          let st = -1; try{ st = player.getPlayerState(); }catch(e){}
          if(st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING){
            setStatus('"한 번 더"를 눌러 재생 시작', true);
          }
        }, 1200);
        renderChunk();
      },
      onStateChange: (e) => {
        if(!cur) return;
        if(e.data === YT.PlayerState.PAUSED){
          // 되감기 직후의 정지는 버퍼링 → 자동 복구, 그 외에는 사용자가 탭한 것으로 간주
          if(Date.now() < (cur.cooldown||0) + 600){
            try{ player.playVideo(); }catch(err){}
          } else if(cur.mode === 'running' || cur.mode === 'review'){
            cur.prevMode = cur.mode;
            cur.mode = 'paused';
            clearInterval(pollTimer); clearTimeout(gapTimer);
            dropWake();
            setStatus('일시정지 · 영상을 탭하면 재개');
          }
        } else if(e.data === YT.PlayerState.PLAYING && cur.mode === 'paused'){
          const back = cur.prevMode || 'running';
          cur.mode = back;
          grabWake();
          if(back === 'review' && cur.rev) startReview((cur.start - cur.rev.from) / 60);
          else { startPoll(); setStatus(''); }
        }
      }
    }
  });
}

/* ───────── 사이클 엔진 ───────── */
function playStep(){
  if(!player || !cur) return;
  if(cur.step >= SPEEDS.length) cur.step = 0;
  cur.mode = 'running';
  clearTimeout(gapTimer);
  try{
    setRate(SPEEDS[cur.step]);
    player.seekTo(cur.start, true);
    player.playVideo();
  }catch(e){}
  cur.cooldown = Date.now() + 400;
  grabWake(); startPoll(); renderSteps(); setStatus('');
}
function startPoll(){
  clearInterval(pollTimer);
  pollTimer = setInterval(()=>{
    if(!player || !cur || cur.mode!=='running') return;
    if(Date.now() < (cur.cooldown||0)) return;      // seek 반영 대기
    let t = 0; try{ t = player.getCurrentTime(); }catch(e){ return; }
    if(t < cur.start - 1.5) return;                 // seek 미반영 상태

    // 정지 감지: 재생 위치가 멈춰 있으면 해당 배속이 지원되지 않는 것으로 보고 복구
    if(Math.abs(t - (cur.lastT ?? -1)) < 0.02){
      cur.stall = (cur.stall || 0) + 1;
      if(cur.stall === 4){
        try{ player.playVideo(); }catch(e){}
      } else if(cur.stall >= 8){
        const bad = effRate(SPEEDS[cur.step]);
        if(RATES) RATES = RATES.filter(x => x !== bad);
        if(!RATES || !RATES.length) RATES = [1];
        cur.stall = 0;
        setRate(SPEEDS[cur.step]);
        try{ player.playVideo(); }catch(e){}
        renderSteps();
        setStatus(bad + '× 미지원 · ' + effRate(SPEEDS[cur.step]) + '×로 대체');
      }
    } else { cur.stall = 0; }
    cur.lastT = t;

    if(t >= cur.start + cur.len - 0.05){
      cur.step++;
      if(cur.step >= SPEEDS.length){
        cur.step = 0;
        cur.round = (cur.round || 1) + 1;
        if(cur.round > MAX_ROUNDS){
          cur.mode = 'paused'; cur.prevMode = 'running';
          try{ player.pauseVideo(); }catch(e){}
          clearInterval(pollTimer);
          dropWake(); renderSteps();
          setStatus('반복 '+MAX_ROUNDS+'회차 도달 · 판정하거나 "한 번 더"', true);
          return;
        }
      }
      // 정지하지 않고 곧바로 되감기 — 일시정지 시 뜨는 유튜브 오버레이 방지
      try{
        setRate(SPEEDS[cur.step]);
        player.seekTo(cur.start, true);
      }catch(e){}
      cur.cooldown = Date.now() + 400;
      cur.lastT = null; cur.stall = 0;
      renderSteps();
    }
  }, POLL_MS);
}
/* ───────── 자막 토글 ───────── */
function applyCC(){
  if(!player) return;
  try{
    if(S.cc){
      player.loadModule('captions');
      setTimeout(()=>{ try{ player.setOption('captions','track',{languageCode:'en'}); }catch(e){} }, 350);
    } else {
      player.unloadModule('captions');
    }
  }catch(e){}
  // 자막은 화면 하단에 표시되므로, 켤 때는 상하 크롭을 해제
  $('playerWrap').classList.toggle('nocrop', !!S.cc);
  $('btnCC').classList.toggle('on', !!S.cc);
}

/* ───────── 복습 (지난 n분 연속듣기) ───────── */
function startReview(mins){
  if(!player || !cur) return;
  const to = cur.start + cur.len;                  // 현재 학습 청크 끝까지
  const from = Math.max(0, cur.start - Math.round(mins*60));
  if(to - from < 2){ setStatus('복습할 구간이 부족합니다'); return; }
  cur.rev = { from, to };
  cur.mode = 'review';
  clearInterval(pollTimer); clearTimeout(gapTimer);
  try{
    setRate(1);
    player.seekTo(from, true);
    player.playVideo();
  }catch(e){}
  cur.cooldown = Date.now() + 400;
  grabWake();
  pollTimer = setInterval(()=>{
    if(!player || !cur || cur.mode !== 'review') return;
    if(Date.now() < (cur.cooldown||0)) return;
    let t = 0; try{ t = player.getCurrentTime(); }catch(e){ return; }
    $('rvTxt').textContent = '복습 중 ' + fmt(t) + ' / ' + fmt(cur.rev.to)
      + ' · 남은 ' + fmt(Math.max(0, cur.rev.to - t));
    if(t >= cur.rev.to - 0.05) endReview();
  }, 300);
  renderReview();
  setStatus('복습 중 · 학습 위치는 ' + fmt(cur.start) + ' 유지');
}
function endReview(){
  if(!cur) return;
  cur.rev = null;
  clearInterval(pollTimer);
  renderReview();
  restartCycle();                                   // 원래 청크로 복귀 (cur.start 변경 없음)
  renderChunk();
}
function renderReview(){
  const on = !!(cur && cur.rev);
  $('reviewOn').classList.toggle('on', on);
  $('reviewBar').classList.toggle('hide', on);
}

function stopAll(){
  clearInterval(pollTimer); clearTimeout(gapTimer);
  if(cur){ cur.prevMode = (cur.mode==='paused' ? (cur.prevMode||'running') : cur.mode); cur.mode = 'paused'; }
  if(player){ try{ player.pauseVideo(); }catch(e){} }
}
function restartCycle(){ cur.step = 0; cur.round = 1; playStep(); }
function advance(){
  const dur = (()=>{ try{ return player.getDuration()||1e9; }catch(e){ return 1e9; } })();
  cur.start = Math.min(cur.start + cur.len, Math.max(0, dur - cur.len));
  persistPos(); restartCycle(); renderChunk();
}
function persistPos(){
  if(!cur) return;
  S.videos[cur.id] = { title:cur.title, pos:cur.start, len:cur.len, at:Date.now() }; save();
}

/* ───────── 렌더 ───────── */
function renderSteps(){
  const row = $('stepsRow'); row.innerHTML = '';
  SPEEDS.forEach((sp,i)=>{
    const d = document.createElement('div');
    d.className = 'step' + (cur ? (i < cur.step ? ' done' : (i === cur.step && cur.mode==='running' ? ' now' : '')) : '');
    const e = effRate(sp);
    const lab = e===1 ? '1×' : (e===0.75 ? '¾×' : (e===0.5 ? '½×' : e+'×'));
    const sub = (i===0) ? '원속' : (e<1 ? '느리게' : '원속 복귀');
    d.innerHTML = lab + '<span class="s-sub">'+sub+'</span>';
    row.appendChild(d);
  });
  const done = cur ? Math.min(cur.step, SPEEDS.length) : 0;
  $('playCount').textContent = done + ' / ' + SPEEDS.length
    + (cur && cur.round > 1 ? ' · ' + cur.round + '회차' : '');
}
function renderChunk(){
  if(!cur) return;
  $('chunkRange').innerHTML = fmt(cur.start) + ' – ' + fmt(cur.start + cur.len)
    + ' <small id="chunkNo">#' + (Math.floor(cur.start / cur.len) + 1) + '</small>';
  $('lenVal').textContent = cur.len + 's';
  renderSteps();
}
function setStatus(msg, await_){ const el=$('statusMsg'); el.textContent=msg; el.className='msg'+(await_?' await':''); }
function renderFlagCnt(){
  $('flagCnt').textContent = S.flags.length;
  $('homeFlagCnt').textContent = S.flags.length ? '('+S.flags.length+')' : '';
  $('homeFlagsWrap').style.display = S.flags.length ? '' : 'none';
}
function renderFlagList(){
  const box = $('flagList'); box.innerHTML = '';
  if(!S.flags.length){ box.innerHTML = '<div class="empty">미해결 구간이 없습니다.<br>10회를 들어도 안 뚫린 구간만 여기 쌓입니다.</div>'; return; }
  [...S.flags].reverse().forEach((f)=>{
    const realIdx = S.flags.indexOf(f);
    const d = document.createElement('div'); d.className='flag-item';
    const url = 'https://youtu.be/' + f.id + '?t=' + Math.max(0, Math.floor(f.start));
    d.innerHTML =
      '<div class="fi-top"><div class="fi-title">'+ (f.title||f.id) +'</div>'+
      '<div class="fi-range num">'+ fmt(f.start) +' – '+ fmt(f.start+f.len) +'</div></div>'+
      '<div class="fi-actions">'+
        '<a href="'+url+'" target="_blank" rel="noopener">YouTube에서 열기</a>'+
        '<button class="jump" data-i="'+realIdx+'">이 구간 재학습</button>'+
        '<button class="del" data-i="'+realIdx+'">삭제</button>'+
      '</div>';
    box.appendChild(d);
  });
  box.querySelectorAll('.del').forEach(b => b.onclick = ()=>{ S.flags.splice(+b.dataset.i,1); save(); renderFlagList(); renderFlagCnt(); });
  box.querySelectorAll('.jump').forEach(b => b.onclick = ()=>{
    const f = S.flags[+b.dataset.i]; if(!f) return;
    closeSheet();
    if(cur && cur.id === f.id){ cur.start = f.start; cur.len = f.len; persistPos(); renderChunk(); restartCycle(); }
    else openTrainer(f.id, f.start, f.len);
  });
}
function relDate(ts){
  if(!ts) return '';
  const d = Math.floor((Date.now()-ts)/86400000);
  if(d <= 0) return '오늘';
  if(d === 1) return '어제';
  if(d < 7) return d+'일 전';
  return new Date(ts).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
}
function renderRecent(){
  const ids = Object.keys(S.videos).sort((a,b)=> (S.videos[b].at||0) - (S.videos[a].at||0));
  $('recentWrap').style.display = ids.length ? '' : 'none';
  const list = $('recentList'); list.innerHTML = '';
  ids.forEach(id=>{
    const v = S.videos[id];
    const row = document.createElement('div'); row.className = 'recent-item';
    const nFlags = S.flags.filter(f=>f.id===id).length;
    row.innerHTML =
      '<button class="go">'+
        '<img class="thumb" src="https://i.ytimg.com/vi/'+id+'/mqdefault.jpg" alt="">'+
        '<span class="meta">'+
          '<span class="t">'+ (v.title || id) +'</span>'+
          '<span class="p"><b class="num">'+ fmt(v.pos) +'</b><span>부터 · '+ (v.len||6) +'초</span>'+
            (nFlags ? '<span>· 미해결 '+nFlags+'</span>' : '') +
            '<span style="margin-left:auto">'+ relDate(v.at) +'</span></span>'+
        '</span>'+
      '</button>'+
      '<button class="rm" aria-label="목록에서 삭제">✕</button>';
    row.querySelector('.go').onclick = ()=> openTrainer(id, v.pos, v.len);
    row.querySelector('.rm').onclick = ()=>{
      if(!confirm('이 영상의 학습 기록을 삭제할까요?\n(미해결 구간은 그대로 남습니다)')) return;
      delete S.videos[id]; save(); renderRecent();
    };
    list.appendChild(row);
  });
}

/* ───────── 화면 전환 ───────── */
function openTrainer(id, startPos, len){
  cur = { id, title:(S.videos[id]&&S.videos[id].title)||'', start:startPos||0, len:len||6, step:0, round:1, rev:null, mode:'idle' };
  $('home').style.display = 'none';
  $('trainer').style.display = 'flex';
  renderReview(); renderHideVid();
  renderChunk(); renderFlagCnt(); setStatus('불러오는 중…');
  if(ytReady) mountPlayer(id); else pendingId = id;
}
function backHome(){
  stopAll(); dropWake();
  if(cur) persistPos();
  cur = null;
  if(player){ player.destroy(); player = null; }
  const wrap = $('playerWrap'); wrap.innerHTML = '<div id="ytp"></div>';
  $('trainer').style.display = 'none';
  $('home').style.display = 'flex';
  renderRecent(); renderFlagCnt();
}

/* ───────── 이벤트 바인딩 ───────── */
$('btnLoad').onclick = ()=>{
  const id = extractId($('urlInput').value.trim());
  if(!id){ $('urlErr').style.display='block'; return; }
  $('urlErr').style.display='none';
  const known = S.videos[id];
  openTrainer(id, known ? known.pos : 0, known ? known.len : 6);
};
$('urlInput').addEventListener('input', ()=> $('urlErr').style.display='none');
$('btnBack').onclick = backHome;

$('btnHeard').onclick = ()=>{ if(!cur) return; if(cur.rev){ cur.rev=null; renderReview(); } advance(); };
$('btnAgain').onclick = ()=>{ if(!cur) return; if(cur.rev){ cur.rev=null; renderReview(); } restartCycle(); };
$('btnFlag').onclick  = ()=>{
  if(!cur) return;
  if(cur.rev){ cur.rev=null; renderReview(); }
  S.flags.push({ id:cur.id, title:cur.title, start:cur.start, len:cur.len, at:Date.now() });
  save(); renderFlagCnt(); advance();
};

$('btnCC').onclick = ()=>{ S.cc = !S.cc; save(); applyCC(); };

$('adjBack').onclick = ()=>{ if(!cur) return; cur.start = Math.max(0, cur.start - 1); persistPos(); renderChunk(); restartCycle(); };
$('adjFwd').onclick  = ()=>{ if(!cur) return; cur.start += 1; persistPos(); renderChunk(); restartCycle(); };
$('lenDown').onclick = ()=>{ if(!cur) return; cur.len = Math.max(1, cur.len - 1); persistPos(); renderChunk(); restartCycle(); };
$('lenUp').onclick   = ()=>{ if(!cur) return; cur.len = Math.min(60, cur.len + 1); persistPos(); renderChunk(); restartCycle(); };

$('prevChunk').onclick = ()=>{ if(!cur) return; cur.start = Math.max(0, cur.start - cur.len); persistPos(); restartCycle(); renderChunk(); };
$('nextChunk').onclick = ()=>{ if(cur) advance(); };

$('btnClearRecent').onclick = ()=>{
  if(!confirm('학습 기록을 모두 삭제할까요?\n(미해결 구간은 그대로 남습니다)')) return;
  S.videos = {}; save(); renderRecent();
};
window.addEventListener('pagehide', ()=>{ if(cur) persistPos(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && cur) persistPos(); });

/* 복습 */
$('reviewBar').querySelectorAll('button').forEach(b=>{
  b.onclick = ()=> startReview(parseFloat(b.dataset.m));
});
$('btnRvEnd').onclick = endReview;

/* 영상 숨기기 */
function renderHideVid(){
  $('playerWrap').classList.toggle('hidevid', !!S.hidevid);
  $('btnHideVid').classList.toggle('on', !!S.hidevid);
  $('btnHideVid').textContent = S.hidevid ? '영상 보기' : '영상 숨기기';
}
$('btnHideVid').onclick = ()=>{ S.hidevid = !S.hidevid; save(); renderHideVid(); };

$('btnSheet').onclick = openSheet;
$('btnHomeFlags').onclick = openSheet;
$('btnSheetClose').onclick = closeSheet;
$('overlay').onclick = closeSheet;
function openSheet(){ renderFlagList(); $('sheet').classList.add('open'); $('overlay').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('open'); $('overlay').classList.remove('on'); }

/* 재생 상태 감시: 앱이 재생 중이라 판단하는데 플레이어가 멈춰 있으면 강제 복구 */
setInterval(()=>{
  if(!player || !cur) return;
  if(cur.mode !== 'running' && cur.mode !== 'review') return;
  if(Date.now() < (cur.cooldown||0)) return;
  let st = -1; try{ st = player.getPlayerState(); }catch(e){ return; }
  if(st === YT.PlayerState.PAUSED || st === YT.PlayerState.CUED){
    try{ player.playVideo(); }catch(e){}
  }
}, 400);

/* 초기화 */
if(location.protocol === 'file:') $('protoWarn').style.display = 'block';
$('btnCC').classList.toggle('on', !!S.cc);
renderHideVid(); renderReview();
renderRecent(); renderFlagCnt(); renderSteps();
</script>
</body>
</html>
